<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Designs, Kaushambi Mate</title>

<style>
  :root{ --ink:#101010; --mid:#5a5f68; --line:#e4e4e8; --paper:#fff; --tint:#f6f7f9; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,Segoe UI,Inter,Arial,sans-serif; line-height:1.5}
  .wrap{max-width:760px; margin:0 auto; padding:64px 24px}
  h1{font-size:24px; margin:0 0 6px}
  p.sub{color:var(--mid); margin:0 0 40px; font-size:14.5px}
  .list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .item{background:var(--paper); display:flex; align-items:center; justify-content:space-between; padding:18px 20px; text-decoration:none; color:inherit; transition:background .15s}
  .item:hover{background:var(--tint)}
  .item b{font-size:15.5px}
  .item span{display:block; font-size:13px; color:var(--mid); margin-top:2px}
  .arrow{color:var(--mid); font-size:14px}
  footer{margin-top:40px; font-size:12.5px; color:var(--mid)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Website Designs</h1>
  <p class="sub">Selected website designs by Kaushambi Mate.</p>
  <div class="list">

    <a class="item" href="https://kaushambimate.com/" target="_blank" rel="noopener"><span><b>Kaushambi Mate</b><span>kaushambimate.com</span></span><span class="arrow">↗</span></a>
  </div>
  <footer>Designed by Kaushambi Mate.</footer>
</div>
</body>
</html>
